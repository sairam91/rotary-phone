name: iOS Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Show available Xcode versions
      run: ls /Applications/ | grep Xcode
      
    - name: Show current Xcode version
      run: xcodebuild -version
      
    - name: Show available simulators
      run: xcrun simctl list devices available | head -20
      
    - name: List available schemes
      run: xcodebuild -list -project RotaryPhone.xcodeproj
      
    - name: Clean build folder
      run: |
        xcodebuild clean \
          -project RotaryPhone.xcodeproj \
          -scheme RotaryPhone \
          -destination 'generic/platform=iOS Simulator'
    
    - name: Build and test
      run: |
        xcodebuild test \
          -project RotaryPhone.xcodeproj \
          -scheme RotaryPhone \
          -destination 'generic/platform=iOS Simulator' \
          -enableCodeCoverage YES \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Generate test report
      if: always()
      run: |
        if [ -d "~/Library/Developer/Xcode/DerivedData" ]; then
          find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -exec echo "Found test results: {}" \;
        fi
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
        retention-days: 30