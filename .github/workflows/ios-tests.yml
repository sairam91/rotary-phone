name: iOS Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main, develop ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Show available Xcode versions
      run: ls /Applications/ | grep Xcode
      
    - name: Show current Xcode version
      run: xcodebuild -version
      
    - name: Show available simulators
      run: xcrun simctl list devices available | head -20
      
    - name: List available schemes
      run: xcodebuild -list -project RotaryPhone.xcodeproj
      
    - name: Create and boot simulator
      run: |
        # Create a new iPhone simulator with available iOS version
        DEVICE_TYPE=$(xcrun simctl list devicetypes | grep iPhone | tail -1 | awk -F'[()]' '{print $(NF-1)}')
        RUNTIME=$(xcrun simctl list runtimes | grep iOS | tail -1 | awk '{print $NF}')
        echo "Creating simulator with device type: $DEVICE_TYPE and runtime: $RUNTIME"
        
        SIMULATOR_UUID=$(xcrun simctl create "TestiPhone" "$DEVICE_TYPE" "$RUNTIME")
        echo "Created simulator: $SIMULATOR_UUID"
        
        # Boot the simulator
        xcrun simctl boot "$SIMULATOR_UUID"
        echo "SIMULATOR_UUID=$SIMULATOR_UUID" >> $GITHUB_ENV
        
    - name: Clean build folder
      run: |
        xcodebuild clean \
          -project RotaryPhone.xcodeproj \
          -scheme RotaryPhone \
          -destination "platform=iOS Simulator,id=$SIMULATOR_UUID"
    
    - name: Build and test
      run: |
        xcodebuild test \
          -project RotaryPhone.xcodeproj \
          -scheme RotaryPhone \
          -destination "platform=iOS Simulator,id=$SIMULATOR_UUID" \
          -enableCodeCoverage YES \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
          
    - name: Cleanup simulator
      if: always()
      run: |
        if [ ! -z "$SIMULATOR_UUID" ]; then
          xcrun simctl shutdown "$SIMULATOR_UUID" || true
          xcrun simctl delete "$SIMULATOR_UUID" || true
        fi
          
    - name: Generate test report
      if: always()
      run: |
        if [ -d "~/Library/Developer/Xcode/DerivedData" ]; then
          find ~/Library/Developer/Xcode/DerivedData -name "*.xcresult" -exec echo "Found test results: {}" \;
        fi
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
        retention-days: 30